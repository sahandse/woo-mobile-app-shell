name: Build Plugin ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare plugin
        run: |
          mkdir -p build/woo-mobile-app-shell
          rsync -av --exclude='.git' --exclude='.github' --exclude='build' ./ build/woo-mobile-app-shell/

      - name: Create ZIP
        run: |
          cd build
          zip -r woo-mobile-app-shell.zip woo-mobile-app-shell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: woo-mobile-app-shell
          path: build/woo-mobile-app-shell.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/woo-mobile-app-shell.zip
          generate_release_notes: true
